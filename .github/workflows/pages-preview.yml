name: Pages preview

# Publishes /site to GitHub Pages as a review preview.
# It is not the production site: brightdepartment.com is deployed separately on Netlify.
on:
  push:
    branches: [site-redesign, main]
    paths: ["site/**", "tools/make-preview.mjs", ".github/workflows/pages-preview.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build preview
        run: node tools/make-preview.mjs site _site "/${{ github.event.repository.name }}"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
